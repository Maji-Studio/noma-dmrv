services:
  postgres:
    image: postgres:18-alpine
    container_name: noma-dmrv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-noma_dmrv_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # postgres:18 images store the cluster in a version subdirectory under
      # /var/lib/postgresql; the volume already holds it at 18/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
