name: Isometric API health

# Daily read-only ping of the Isometric Certify sandbox to catch upstream
# breakage (auth regressions, schema drift, downtime) before it surfaces as a
# user-facing submit failure. Runs only the opt-in vitest file
# tests/isometric-sandbox-health.integration.test.ts — the registry's read
# paths, including projects, templates, GHG entries, and blueprints. Write
# paths live in a separate file this workflow never collects.
# No writes. No noma DB. No app boot.
#
# This workflow intentionally uses its dedicated environment credential pair
# through getIsometricClientFromEnv; it does not read per-organization DB rows
# and therefore does not need CREDENTIALS_ENCRYPTION_KEY.
# Secrets come from 1Password via the "Load Isometric secrets" step below:
#   op://Environment Variables/noma-dmrv env staging/{ISOMETRIC_CLIENT_SECRET,
#   ISOMETRIC_ACCESS_TOKEN, ISOMETRIC_DEMO_PROJECT_ID}
# CI authenticates with a single repo secret, OP_SERVICE_ACCOUNT_TOKEN. Keep
# the 1Password item in the same Isometric org that owns the sandbox demo
# project. A missing token or credential fails this health check rather than
# reporting a false green result.

on:
  schedule:
    # Once a day at 09:17 UTC — early enough that EU operators see a red
    # check before lunch, late enough that a US morning fix still ships
    # same day. Minute 17 avoids the :00 cron pile-up on GH Actions.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ISOMETRIC_SANDBOX_TESTS: "1"
      ISOMETRIC_ENVIRONMENT: sandbox
      # Pinned Certify OpenAPI spec URL — used by the regenerate-certify-types
      # step below to detect upstream schema drift.
      ISOMETRIC_OPENAPI_URL: "https://docs.isometric.com/api-reference/certify/mrv.openapi.json"
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Don't persist GITHUB_TOKEN into the workspace — read-only ping,
          # no commits or pushes; keeping the token out of .git/config
          # avoids leaking it to later steps or artifacts.
          persist-credentials: false

      - name: Setup pnpm
        id: pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Not gated on OP_SERVICE_ACCOUNT_TOKEN: a health check that skips its own
      # credentials reports green while the registry is unreachable. Missing
      # secrets fail the run.
      - name: Load Isometric secrets from 1Password
        id: credentials
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISOMETRIC_ACCESS_TOKEN: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_ACCESS_TOKEN
          ISOMETRIC_CLIENT_SECRET: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_CLIENT_SECRET
          ISOMETRIC_DEMO_PROJECT_ID: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_DEMO_PROJECT_ID

      - name: Ping Isometric sandbox (read paths)
        id: api
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.credentials.outcome == 'success' }}
        run: pnpm test:isometric-health

      # Asserts every (group, blueprint,
      # input) tuple in the live template has an ordinary or sequestration
      # binding. The fixture has no period-input exceptions; PROJECT-scope
      # tuples fail. No DB required.
      - name: Live template input coverage (fixture-selected templates)
        id: coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.credentials.outcome == 'success' }}
        # The shared client/logger validate the app env at import time. These
        # inert values satisfy that schema; fixture mode never connects to a DB
        # or starts auth. Real registry credentials still come from 1Password.
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
          NEXT_PUBLIC_APP_URL: http://localhost:3100
          BETTER_AUTH_SECRET: health-check-placeholder-not-an-auth-secret
        run: pnpm isometric:coverage-check -- --source=fixture

      # Plan §8 (Thread B2). Regenerates `certify.d.ts` from the pinned
      # spec URL and fails if the working tree differs — surfaces upstream
      # OpenAPI changes the day they ship. Fix is local regen + commit.
      - name: Detect Certify OpenAPI drift
        id: openapi
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm regenerate-certify-types
          if ! git diff --exit-code src/lib/isometric/generated/certify.d.ts; then
            echo "::error::Certify OpenAPI drift detected. Run 'pnpm regenerate-certify-types' locally and commit src/lib/isometric/generated/certify.d.ts."
            git --no-pager diff src/lib/isometric/generated/certify.d.ts
            exit 1
          fi

      - name: Summarize and enforce health outcomes
        if: ${{ always() }}
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PNPM: ${{ steps.pnpm.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          API: ${{ steps.api.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          OPENAPI: ${{ steps.openapi.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Isometric sandbox health

          | Step | Outcome |
          | --- | --- |
          | Checkout | $CHECKOUT |
          | pnpm setup | $PNPM |
          | Node setup | $NODE |
          | Dependency install | $INSTALL |
          | Sandbox credentials | $CREDENTIALS |
          | API read health | $API |
          | Live template input coverage (fixture source) | $COVERAGE |
          | Public OpenAPI drift | $OPENAPI |

          Sandbox/read-only checks only; no production readiness claim, DB checks,
          registry writes, or Project Component coverage. Fixture mode selects project
          and template IDs locally but fetches templates live.

          - Setup failure: inspect the failed setup step; reproduce install with \`pnpm install --frozen-lockfile\`.
          - Credentials failure: check OP_SERVICE_ACCOUNT_TOKEN and the three Isometric fields in the staging 1Password item; confirm they belong to the sandbox demo project's organization. Never paste credentials into logs.
          - API failure: with sandbox credentials, ISOMETRIC_ENVIRONMENT=sandbox and ISOMETRIC_DEMO_PROJECT_ID configured, run \`pnpm test:isometric-health\`.
          - Coverage failure: with sandbox credentials configured, run \`pnpm isometric:coverage-check -- --source=fixture\`; inspect live template bindings and the explicit fixture allowlist.
          - OpenAPI failure: run \`pnpm regenerate-certify-types\`; inspect fetch/generation errors or review \`git diff -- src/lib/isometric/generated/certify.d.ts\` before committing an intentional type refresh.
          - Skipped or cancelled checks are incomplete, never evidence of health. Fix prerequisites and rerun the workflow.
          EOF

          for outcome in "$CHECKOUT" "$PNPM" "$NODE" "$INSTALL" "$CREDENTIALS" "$API" "$COVERAGE" "$OPENAPI"; do
            if [ "$outcome" != success ]; then
              echo "::error::Isometric health is incomplete or failed; see the step summary."
              exit 1
            fi
          done
