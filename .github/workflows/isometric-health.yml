name: Isometric API health

# Daily read-only ping of the Isometric Certify sandbox to catch upstream
# breakage (auth regressions, incompatible OpenAPI changes, downtime) before it
# surfaces as a user-facing submit failure. Runs only the opt-in vitest file
# tests/isometric-sandbox-health.integration.test.ts — the registry's read
# paths, including projects, templates, GHG entries, and blueprints. Write
# paths live in a separate file this workflow never collects.
# No writes. No noma DB. No app boot.
# Public Certify spec changes warn if regenerated types still compile; generation
# errors, removed operations or code that no longer compiles fail the check.
#
# This workflow intentionally uses its dedicated environment credential pair
# through getIsometricClientFromEnv; it does not read per-organization DB rows
# and therefore does not need CREDENTIALS_ENCRYPTION_KEY.
# Secrets come from 1Password via the "Load Isometric secrets" step below:
#   op://Environment Variables/noma-dmrv env staging/{ISOMETRIC_CLIENT_SECRET,
#   ISOMETRIC_ACCESS_TOKEN, ISOMETRIC_DEMO_PROJECT_ID}
# CI authenticates with a single repo secret, OP_SERVICE_ACCOUNT_TOKEN. Keep
# the 1Password item in the same Isometric org that owns the sandbox demo
# project. A missing token or credential fails this health check rather than
# reporting a false green result.

on:
  schedule:
    # Once a day at 09:17 UTC — early enough that EU operators see a red
    # check before lunch, late enough that a US morning fix still ships
    # same day. Minute 17 avoids the :00 cron pile-up on GH Actions.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail a probe job to verify GitHub issue notifications (skips health checks)"
        type: boolean
        default: false

permissions:
  contents: read

# 1Password CLI installed by load-secrets-action. Pinned so a new CLI release
# cannot change secret loading unannounced; bump it deliberately (docs/security.md).
env:
  OP_CLI_VERSION: "2.39.0"

jobs:
  ping:
    if: ${{ !inputs.force_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_ISOMETRIC_SANDBOX_TESTS: "1"
      ISOMETRIC_ENVIRONMENT: sandbox
      # Pinned Certify OpenAPI spec URL — used by the regenerate-certify-types
      # step below to check compatibility with upstream schema changes.
      ISOMETRIC_OPENAPI_URL: "https://docs.isometric.com/api-reference/certify/mrv.openapi.json"
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Don't persist GITHUB_TOKEN into the workspace — read-only ping,
          # no commits or pushes; keeping the token out of .git/config
          # avoids leaking it to later steps or artifacts.
          persist-credentials: false

      - name: Setup pnpm
        id: pnpm
        # Version comes from packageManager in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # Not gated on OP_SERVICE_ACCOUNT_TOKEN: a health check that skips its own
      # credentials reports green while the registry is unreachable. Missing
      # secrets fail the run.
      - name: Load Isometric secrets from 1Password
        id: credentials
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
          version: ${{ env.OP_CLI_VERSION }}
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISOMETRIC_ACCESS_TOKEN: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_ACCESS_TOKEN
          ISOMETRIC_CLIENT_SECRET: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_CLIENT_SECRET
          ISOMETRIC_DEMO_PROJECT_ID: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_DEMO_PROJECT_ID

      - name: Ping Isometric sandbox (read paths)
        id: api
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.credentials.outcome == 'success' }}
        run: pnpm test:isometric-health

      # Uses readiness/submission line contracts (ADR 0032) for live templates.
      # Fixture reviews override proposals by component ID. Unknown fixture IDs,
      # unsettled contracts, forbidden lines and unmapped inputs fail; entry-only
      # lines warn. No DB required.
      - name: Live template input coverage (fixture-selected templates)
        id: coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.credentials.outcome == 'success' }}
        run: pnpm isometric:coverage-check -- --source=fixture

      # Regenerating from the public spec needs no secrets. Changed types must
      # preserve operations and compile; compatible refreshes need a later commit.
      - name: Check Certify OpenAPI compatibility
        id: openapi
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          types_file="src/lib/isometric/generated/certify.d.ts"
          diff_line_limit=300
          diff_file=$(mktemp "$RUNNER_TEMP/certify-diff.XXXXXX")
          pnpm regenerate-certify-types
          if git --no-pager diff --exit-code -- "$types_file" > "$diff_file"; then
            echo "result=unchanged" >> "$GITHUB_OUTPUT"
            exit 0
          else
            diff_status=$?
            if [ "$diff_status" -ne 1 ]; then
              echo "::error::Could not compare regenerated Certify types. Inspect the git diff error and rerun."
              exit "$diff_status"
            fi
          fi

          baseline_file=$(mktemp "$RUNNER_TEMP/certify-baseline.XXXXXX")
          removed_file=$(mktemp "$RUNNER_TEMP/certify-removed.XXXXXX")
          git show "HEAD:$types_file" > "$baseline_file"
          breaking=false
          if node scripts/certify-removed-operations.mjs "$baseline_file" "$types_file" > "$removed_file"; then
            :
          else
            removal_status=$?
            breaking=true
            if [ "$removal_status" -eq 1 ]; then
              while IFS= read -r operation; do
                echo "::error::Removed Certify operation: $operation"
              done < "$removed_file"
            else
              echo "::error::Could not check Certify operations. Inspect the checker error above and rerun."
            fi
          fi

          # Mirrors ci.yml's quality-static job: typecheck needs only the install,
          # with no Next.js route generation, app boot, DB or app env preparation.
          if pnpm typecheck; then
            :
          else
            breaking=true
            echo "::error::Our code no longer compiles against Isometric's current Certify OpenAPI spec. See the tsc errors above."
          fi

          if [ "$breaking" = false ]; then
            echo "result=compatible" >> "$GITHUB_OUTPUT"
            echo "::warning::Certify OpenAPI spec changed, but our code still compiles. Run 'pnpm regenerate-certify-types' and commit when convenient."
            {
              echo '<details>'
              echo '<summary>Certify OpenAPI spec changed, still compiles</summary>'
              echo
              echo 'run `pnpm regenerate-certify-types` and commit when convenient'
              echo
              echo '```text'
              git --no-pager diff --stat -- "$types_file"
              echo '```'
              echo
              echo '```diff'
              sed -n "1,${diff_line_limit}p" "$diff_file"
              echo '```'
              if [ "$(wc -l < "$diff_file")" -gt "$diff_line_limit" ]; then
                echo
                echo "Diff truncated to the first $diff_line_limit lines."
              fi
              echo
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "result=breaking" >> "$GITHUB_OUTPUT"
            echo "::error::Breaking Certify spec change. Run 'pnpm regenerate-certify-types' locally, fix callers, run 'pnpm typecheck', and commit the generated types and caller fixes. See the errors above and diff below."
            sed -n "1,${diff_line_limit}p" "$diff_file"
            if [ "$(wc -l < "$diff_file")" -gt "$diff_line_limit" ]; then
              echo "Diff truncated to the first $diff_line_limit lines."
            fi
            exit 1
          fi

      - name: Summarize and enforce health outcomes
        if: ${{ always() }}
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          PNPM: ${{ steps.pnpm.outcome }}
          NODE: ${{ steps.node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          CREDENTIALS: ${{ steps.credentials.outcome }}
          API: ${{ steps.api.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
          OPENAPI: ${{ steps.openapi.outcome }}
          OPENAPI_RESULT: ${{ steps.openapi.outputs.result }}
        run: |
          openapi_display="$OPENAPI"
          case "$OPENAPI:$OPENAPI_RESULT" in
            success:compatible) openapi_display="success (spec changed, still compiles)" ;;
            success:unchanged) openapi_display="success (spec unchanged)" ;;
            failure:breaking) openapi_display="failure (breaking spec change)" ;;
          esac
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Isometric sandbox health

          | Step | Outcome |
          | --- | --- |
          | Checkout | $CHECKOUT |
          | pnpm setup | $PNPM |
          | Node setup | $NODE |
          | Dependency install | $INSTALL |
          | Sandbox credentials | $CREDENTIALS |
          | API read health | $API |
          | Live template input coverage (fixture source) | $COVERAGE |
          | Public OpenAPI compatibility | $openapi_display |

          Sandbox/read-only checks only; no production readiness claim, DB checks,
          registry writes, or Project Component coverage. Fixture mode selects project
          and template IDs and explicit reviewed line contracts locally but fetches
          templates live. Unknown fixture component IDs fail; new lines still need review.

          - Setup failure: inspect the failed setup step; reproduce install with \`pnpm install --frozen-lockfile\`.
          - Credentials failure: check OP_SERVICE_ACCOUNT_TOKEN and the three Isometric fields in the staging 1Password item; confirm they belong to the sandbox demo project's organization. Never paste credentials into logs.
          - API failure: with sandbox credentials, ISOMETRIC_ENVIRONMENT=sandbox and ISOMETRIC_DEMO_PROJECT_ID configured, run \`pnpm test:isometric-health\`.
          - Coverage failure: with sandbox credentials configured, run \`pnpm isometric:coverage-check -- --source=fixture\`; inspect live template line contracts, fixture reviews and reported input bindings (ADR 0032). Entry-only lines warn; unknown fixture IDs, unsettled contracts, forbidden lines and unmapped inputs fail.
          - OpenAPI failure: inspect fetch/generation errors first. If regenerated types remove operations or break compilation, run \`pnpm regenerate-certify-types\` locally, fix callers, run \`pnpm typecheck\`, and commit the generated types and caller fixes. Compatible spec changes only warn and can be committed when convenient.
          - Skipped or cancelled checks are incomplete, never evidence of health. Fix prerequisites and rerun the workflow.
          EOF

          for outcome in "$CHECKOUT" "$PNPM" "$NODE" "$INSTALL" "$CREDENTIALS" "$API" "$COVERAGE" "$OPENAPI"; do
            if [ "$outcome" != success ]; then
              echo "::error::Isometric health is incomplete or failed; see the step summary."
              exit 1
            fi
          done

  notification-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_failure }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Force a health failure notification
        run: exit 1

  notify-failure:
    needs: [ping, notification-probe]
    if: >-
      ${{ always() &&
          ((github.event_name == 'schedule' &&
            (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))) ||
           (github.event_name == 'workflow_dispatch' && inputs.force_failure &&
            contains(needs.*.result, 'failure'))) }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/health-failure-notify.yml
    with:
      workflow-file: isometric-health.yml
      environment: staging / Isometric sandbox
