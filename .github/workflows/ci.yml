name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static quality checks run independently from the database-backed test suite,
  # so they can complete in parallel without waiting for Postgres provisioning.
  # Complements e2e.yml, whose dev-server harness does NOT surface type errors or
  # build breakage.
  quality-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version comes from packageManager in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation references
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Org-scoping check
        run: pnpm check:org-scoping

      # Every export of a "use server" module is a public action the browser
      # can call with any arguments; this fails any export that accepts an
      # OrgContext, a db/tx handle or a Parameters<> passthrough.
      - name: Server-action export check
        run: pnpm check:server-action-exports

      # Tailwind's spacing scale is an allow-list here (`--spacing-*: initial`),
      # so an off-scale utility compiles to nothing and fails silently at
      # runtime rather than at build time. Nothing else catches it.
      - name: Spacing-scale check
        run: pnpm check:spacing-scale

      # The same silence for custom properties: a var(--x) that nothing
      # defines leaves the property at its initial value with no error.
      - name: CSS custom-property check
        run: pnpm check:css-vars

      # docs/ux-writing.md bans en and em dashes in user-facing copy; this
      # parses string literals and JSX text (never comments) to enforce it.
      - name: UX-copy dash check
        run: pnpm check:ux-copy

  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Checkout comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .openapi-base
          persist-credentials: false

      - name: Compare public API contracts
        # A deliberate break regenerates v1.json and adds its method/path and
        # exact oasdiff singleline change description to accepted-breaking-changes.txt
        # in the same PR. --err-ignore accepts only those listed findings.
        # Remove stale acceptances once the changed contract reaches the base.
        shell: bash
        run: |
          set -euo pipefail
          base=.openapi-base/openapi/v1.json
          if [[ ! -f "$base" ]]; then
            echo "Base branch has no openapi/v1.json; first release has no breaking-change baseline."
            exit 0
          fi
          curl --fail --silent --show-error --location \
            https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/oasdiff.tar.gz"
          echo "7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f  $RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oasdiff"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff" oasdiff
          "$RUNNER_TEMP/oasdiff/oasdiff" breaking "$base" openapi/v1.json \
            --fail-on ERR --err-ignore openapi/accepted-breaking-changes.txt

  # Full Vitest suite. No secrets — tests/setup.ts fills safe env defaults and
  # the Isometric sandbox *.integration.test.ts suites self-skip without
  # RUN_ISOMETRIC_SANDBOX_TESTS. A throwaway Postgres service is required
  # because several suites exercise the real `@/db` connection + transactions
  # rather than mocking the data-access layer.
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the tests/setup.ts default so the DB-backed suites reach the
      # service above. vitest sets NODE_ENV=test, so the local-fs storage
      # default and missing secrets are accepted by @/config/env.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_test
      # Matches .env.test: contract suites share one localhost IP bucket. The
      # limiter's own tests stub this off or call the bucket directly.
      DISABLE_RATE_LIMIT: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version comes from packageManager in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm exec vitest run

  # Production build check. PRs opt into the experimental Turbopack filesystem
  # cache; pushes to main/staging keep it off and exercise the deploy-equivalent
  # compiler path from scratch. `next build` runs as NODE_ENV=production, so
  # @/config/env demands s3-compatible storage + a few core vars. The values
  # below are throwaway placeholders that ONLY satisfy Zod schema validation —
  # no real secrets, no network or DB access (routes are dynamic/auth-gated, so
  # the build does not query the database).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NOMA_HERMETIC_CI: "true"
      NOMA_TURBOPACK_BUILD_CACHE: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-a-real-key
      ISOMETRIC_ENVIRONMENT: sandbox
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: ci-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ci-build
      STORAGE_SECRET_ACCESS_KEY: ci-build-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version comes from packageManager in package.json.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Cache only Next's incremental compiler data, not the runnable .next
      # output. Turbopack invalidates changed source inputs, so one immutable
      # seed per PR avoids an archive per push. CI stays separate from E2E
      # because the two builds use different environment profiles.
      - name: Restore Next.js build cache
        if: github.event_name == 'pull_request'
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          # Keep build-config inputs aligned with the E2E profile's key.
          key: ${{ runner.os }}-nextjs-ci-build-${{ hashFiles('**/pnpm-lock.yaml') }}-pr-${{ github.event.pull_request.number }}-${{ hashFiles('next.config.*', 'tsconfig*.json', 'postcss.config.*', 'package.json', '.github/workflows/ci.yml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Save Next.js build cache
        id: next-cache-save
        if: ${{ success() && github.event_name == 'pull_request' && steps.next-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Report Next.js build cache save failure
        if: ${{ steps.next-cache-save.outcome == 'failure' }}
        run: echo "::warning::Next.js build cache save failed; build results remain valid."
