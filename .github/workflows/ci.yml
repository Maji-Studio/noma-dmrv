name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: lint + typecheck + unit/integration tests. No secrets —
  # tests/setup.ts fills safe env defaults and the lone *.integration.test.ts
  # self-skips without RUN_ISOMETRIC_SANDBOX_TESTS. A throwaway Postgres service
  # is provisioned because a handful of suites (applications, credit-batch,
  # biochar-product-bin-formulation) exercise the real `@/db` connection +
  # transactions rather than mocking the data-access layer; without it they fail
  # with ECONNREFUSED. Complements e2e.yml, whose dev-server harness does NOT
  # surface type errors or build breakage.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the tests/setup.ts default so the DB-backed suites reach the
      # service above. vitest sets NODE_ENV=test, so the local-fs storage
      # default and missing secrets are accepted by @/config/env.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_test

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation references
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Org-scoping check
        run: pnpm check:org-scoping

      # Tailwind's spacing scale is an allow-list here (`--spacing-*: initial`),
      # so an off-scale utility compiles to nothing and fails silently at
      # runtime rather than at build time. Nothing else catches it.
      - name: Spacing-scale check
        run: pnpm check:spacing-scale

      # docs/ux-writing.md bans en and em dashes in user-facing copy; this
      # parses string literals and JSX text (never comments) to enforce it.
      - name: UX-copy dash check
        run: pnpm check:ux-copy

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      - name: Unit tests
        run: pnpm exec vitest run

  # Production build check. `next build` runs as NODE_ENV=production, so
  # @/config/env demands s3-compatible storage + a few core vars. The values
  # below are throwaway placeholders that ONLY satisfy Zod schema validation —
  # no real secrets, no network or DB access (routes are dynamic/auth-gated, so
  # the build does not query the database).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-a-real-key
      ISOMETRIC_ENVIRONMENT: sandbox
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: ci-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ci-build
      STORAGE_SECRET_ACCESS_KEY: ci-build-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
