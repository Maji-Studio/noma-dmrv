name: CI

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new push to an open PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static quality checks run independently from the database-backed test suite,
  # so they can complete in parallel without waiting for Postgres provisioning.
  # Complements e2e.yml, whose dev-server harness does NOT surface type errors or
  # build breakage.
  quality-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Documentation references
        run: pnpm docs:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Org-scoping check
        run: pnpm check:org-scoping

      # Tailwind's spacing scale is an allow-list here (`--spacing-*: initial`),
      # so an off-scale utility compiles to nothing and fails silently at
      # runtime rather than at build time. Nothing else catches it.
      - name: Spacing-scale check
        run: pnpm check:spacing-scale

      # docs/ux-writing.md bans en and em dashes in user-facing copy; this
      # parses string literals and JSX text (never comments) to enforce it.
      - name: UX-copy dash check
        run: pnpm check:ux-copy

  # Full Vitest suite. No secrets — tests/setup.ts fills safe env defaults and
  # the lone *.integration.test.ts self-skips without
  # RUN_ISOMETRIC_SANDBOX_TESTS. A throwaway Postgres service is required
  # because several suites exercise the real `@/db` connection + transactions
  # rather than mocking the data-access layer.
  quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides the tests/setup.ts default so the DB-backed suites reach the
      # service above. vitest sets NODE_ENV=test, so the local-fs storage
      # default and missing secrets are accepted by @/config/env.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      - name: Unit tests
        run: pnpm exec vitest run

  # Production build check. `next build` runs as NODE_ENV=production, so
  # @/config/env demands s3-compatible storage + a few core vars. The values
  # below are throwaway placeholders that ONLY satisfy Zod schema validation —
  # no real secrets, no network or DB access (routes are dynamic/auth-gated, so
  # the build does not query the database).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_build
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NOMA_HERMETIC_CI: "true"
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-not-a-real-key
      ISOMETRIC_ENVIRONMENT: sandbox
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: ci-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ci-build
      STORAGE_SECRET_ACCESS_KEY: ci-build-placeholder
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Cache only Next's incremental compiler data, not the runnable .next
      # output. The build profile stays separate from E2E because its env differs.
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          key: ${{ runner.os }}-nextjs-ci-build-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.*', 'tsconfig*.json', 'postcss.config.*', 'package.json', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-ci-build-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Save Next.js build cache
        if: ${{ success() && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache/turbopack
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
