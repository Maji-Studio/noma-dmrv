name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: playwright (${{ matrix.shard_id }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_id: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_e2e
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ALLOW_SELF_SIGNUP: "false"
      DISABLE_RATE_LIMIT: "true"
      # Playwright builds + serves a production bundle on CI
      # (playwright.config.ts), so NODE_ENV=production and @/config/env rejects
      # the local-fs default as a fail-closed safeguard. No spec round-trips
      # bytes to storage yet (real-Spaces CI coverage was deprioritized — see
      # docs/archive/2026-05-21-e2e-spaces-integration.md), so these throwaway
      # placeholders only satisfy Zod validation; build/boot never call S3.
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: e2e-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: e2e-build
      STORAGE_SECRET_ACCESS_KEY: e2e-build-placeholder
      # Isometric — PR CI is HERMETIC: no sandbox credentials are loaded, so
      # the isometric client is not configured, the app degrades to its
      # not_configured paths, and zero external HTTP calls are made. Specs that
      # need the live sandbox are tagged @live (and additionally test.skip on
      # missing ISOMETRIC_DEMO_PROJECT_ID); they run in e2e-live.yml on a
      # nightly schedule instead. ISOMETRIC_ENVIRONMENT is pinned to `sandbox`
      # (never empty) so the env-schema enum does not reject an empty string.
      ISOMETRIC_ENVIRONMENT: sandbox
      PLAYWRIGHT_WORKERS: "2"
      PLAYWRIGHT_RETRIES: "1"

    steps:
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~130MB; `playwright install` skips the download on
      # a cache hit (system deps via --with-deps still install either way).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Write local env file for CLI scripts
        run: |
          cat <<EOF > .env.local
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          ALLOW_SELF_SIGNUP=${ALLOW_SELF_SIGNUP}
          DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
          EOF

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      # @live specs (real Isometric sandbox) are excluded here and covered by
      # the nightly e2e-live.yml workflow.
      - name: Run Playwright suite
        run: pnpm test:e2e --shard=${{ matrix.shard_id }}/4 --grep-invert "@live"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.shard_id }}-of-4
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
