name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: playwright (${{ matrix.shard_id }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_id: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_e2e
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ALLOW_SELF_SIGNUP: "false"
      DISABLE_RATE_LIMIT: "true"
      # Playwright builds + serves a production bundle on CI
      # (playwright.config.ts), so NODE_ENV=production and @/config/env rejects
      # the local-fs default as a fail-closed safeguard. No spec round-trips
      # bytes to storage yet (real-Spaces CI coverage was deprioritized — see
      # docs/archive/2026-05-21-e2e-spaces-integration.md), so these throwaway
      # placeholders only satisfy Zod validation; build/boot never call S3.
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: e2e-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: e2e-build
      STORAGE_SECRET_ACCESS_KEY: e2e-build-placeholder
      # Isometric sandbox — OPTIONAL. The three secret values
      # (ISOMETRIC_ACCESS_TOKEN / _CLIENT_SECRET / _DEMO_PROJECT_ID) are pulled
      # from 1Password by the "Load Isometric secrets" step below — they reach
      # the Playwright process + webServer via $GITHUB_ENV, NOT job-level env.
      # When OP_SERVICE_ACCOUNT_TOKEN is absent (e.g. fork PRs, which cannot read
      # secrets) that step is skipped, the vars stay unset, and the gated
      # certification specs `test.skip` cleanly — @/config/env treats empty as
      # unset and enforces both-or-neither. ISOMETRIC_ENVIRONMENT is pinned to
      # `sandbox` (never empty) so the env-schema enum does not reject an empty
      # string.
      ISOMETRIC_ENVIRONMENT: sandbox
      PLAYWRIGHT_WORKERS: "2"
      PLAYWRIGHT_RETRIES: "1"
      # Exposed at job level because the `secrets` context is NOT available in
      # step-level `if:` expressions — only `env` is. The load step below gates
      # on `env.OP_SERVICE_ACCOUNT_TOKEN` so it self-skips on fork PRs.
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

    steps:
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Skipped on fork PRs (no OP_SERVICE_ACCOUNT_TOKEN) so the gated
      # certification specs self-skip instead of failing the load.
      - name: Load Isometric secrets from 1Password
        if: ${{ env.OP_SERVICE_ACCOUNT_TOKEN != '' }}
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISOMETRIC_ACCESS_TOKEN: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_ACCESS_TOKEN
          ISOMETRIC_CLIENT_SECRET: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_CLIENT_SECRET
          ISOMETRIC_DEMO_PROJECT_ID: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_DEMO_PROJECT_ID

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Write local env file for CLI scripts
        run: |
          cat <<EOF > .env.local
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          ALLOW_SELF_SIGNUP=${ALLOW_SELF_SIGNUP}
          DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
          EOF

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      - name: Run Playwright suite
        run: pnpm test:e2e --shard=${{ matrix.shard_id }}/4

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ matrix.shard_id }}-of-4
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
