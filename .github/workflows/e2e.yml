name: E2E

on:
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: playwright (${{ matrix.shard_id }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard_id: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_e2e
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ALLOW_SELF_SIGNUP: "false"
      DISABLE_RATE_LIMIT: "true"
      # Playwright builds + serves a production bundle on CI
      # (playwright.config.ts), but the suite is hermetic and localhost-only.
      # Use local-fs so upload specs can round-trip bytes without external
      # object-storage credentials; src/config/env.ts allows this only for CI
      # localhost E2E, never for real production deployments.
      STORAGE_PROVIDER: local-fs
      STORAGE_LOCAL_FS_ROOT: .storage-e2e
      STORAGE_SIGNING_SECRET: local-storage-signing-secret-local-32
      # Isometric — PR CI is HERMETIC: no sandbox credentials are loaded, so
      # the isometric client is not configured, the app degrades to its
      # not_configured paths, and zero external HTTP calls are made. Specs that
      # need the live sandbox are tagged @live (and additionally test.skip on
      # missing ISOMETRIC_DEMO_PROJECT_ID); they run in e2e-live.yml on a
      # nightly schedule instead. ISOMETRIC_ENVIRONMENT is pinned to `sandbox`
      # (never empty) so the env-schema enum does not reject an empty string.
      ISOMETRIC_ENVIRONMENT: sandbox
      # Geo — hermetic like Isometric/storage above: the stub adapter serves
      # deterministic geocode/route fixtures, so position-picker specs make
      # zero external HTTP calls and need no ORS/MapTiler keys. The env
      # schema's "no stub in production" safeguard carves out CI for exactly
      # this build (src/config/env.ts).
      GEO_PROVIDER: stub
      PLAYWRIGHT_WORKERS: "2"
      PLAYWRIGHT_RETRIES: "1"

    steps:
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Browser binaries are ~130MB; `playwright install` skips the download on
      # a cache hit (system deps via --with-deps still install either way).
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Write local env file for CLI scripts
        run: |
          cat <<EOF > .env.local
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          ALLOW_SELF_SIGNUP=${ALLOW_SELF_SIGNUP}
          DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
          STORAGE_PROVIDER=${STORAGE_PROVIDER}
          STORAGE_LOCAL_FS_ROOT=${STORAGE_LOCAL_FS_ROOT}
          STORAGE_SIGNING_SECRET=${STORAGE_SIGNING_SECRET}
          EOF

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      # @live specs (real Isometric sandbox) are excluded here and covered by
      # the nightly e2e-live.yml workflow.
      - name: Run Playwright suite
        run: pnpm test:e2e --shard=${{ matrix.shard_id }}/4 --grep-invert "@live"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-artifacts-${{ matrix.shard_id }}-of-4
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
