name: Reset production database

on:
  workflow_dispatch:
    inputs:
      authorized:
        description: "Check only after explicit approval to wipe production"
        required: true
        type: boolean
      confirmation:
        description: "Type RESET PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: production-reset-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reset-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event.inputs.authorized == 'true' &&
      github.event.inputs.confirmation == 'RESET PRODUCTION'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset production database from tracked migrations
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
