name: PR migration gate

on:
  pull_request:
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
      # Seed changes alter the canonical fixture used by future gates. This run
      # still uses the base copy, so candidate seed edits cannot mask a conflict.
      - "src/db/seed-data.ts"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded checks for the same pull request or manually selected ref.
concurrency:
  group: migration-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # All values are runner-local and disposable; this job never loads
      # repository or environment secrets.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_migration_gate
      ADMIN_EMAIL: migration-gate-admin@ci.local

    steps:
      # Pull requests start from their immutable base SHA. Manual runs compare
      # the selected ref against staging, which makes feature-branch dispatches
      # useful while keeping the baseline predictable.
      - name: Checkout base revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'staging' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install base dependencies
        run: pnpm install --frozen-lockfile

      # Match the E2E bootstrap convention: the synthetic admin's password is
      # random per run and exists only for this throwaway database.
      - name: Generate ephemeral admin password
        run: echo "ADMIN_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      # Build and seed the exact base state before introducing PR code. A fresh
      # database missed 0074's CHECK failure because only legacy data violated
      # it; the base seed reproduced the conflicting rows.
      - name: Apply base migrations
        run: pnpm db:migrate

      - name: Ensure base admin and organization
        run: pnpm db:ensure-admin

      - name: Seed base data
        run: pnpm db:seed

      # github.ref is GitHub's prospective merge ref for pull requests, so this
      # tests what will land rather than the head branch in isolation. A manual
      # run uses the commit selected in the workflow-dispatch UI.
      - name: Checkout merge candidate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # The second checkout cleans node_modules, and the candidate lockfile may
      # differ from the base, so install again against the candidate revision.
      - name: Install candidate dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply candidate migrations to seeded base
        run: pnpm db:migrate

      - name: Verify candidate schema
        run: pnpm db:verify-schema
