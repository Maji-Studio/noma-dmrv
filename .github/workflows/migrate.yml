name: Database management

on:
  push:
    branches: [main, staging]
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - ensure-admin
          - push-schema
          - reset-and-push
        default: ensure-admin
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
          - both
        default: staging
      confirmation:
        description: "Type CONFIRM for destructive actions (reset-and-push)"
        required: false
        type: string

concurrency:
  group: database-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Auto-migration pipeline (on push to main) ───────────────────────
  migrate-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: migrate-staging
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    needs: verify-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify production schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Manual actions ──────────────────────────────────────────────────
  ensure-admin-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'ensure-admin' &&
      (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure admin user
        run: pnpm db:ensure-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  ensure-admin-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'ensure-admin' &&
      (github.event.inputs.environment == 'production' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure admin user
        run: pnpm db:ensure-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  push-schema-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'push-schema' &&
      github.event.inputs.confirmation == 'CONFIRM' &&
      (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ensure admin user
        run: pnpm db:ensure-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  push-schema-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'push-schema' &&
      github.event.inputs.confirmation == 'CONFIRM' &&
      (github.event.inputs.environment == 'production' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema
        run: pnpm db:push
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Ensure admin user
        run: pnpm db:ensure-admin
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  reset-and-push-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'reset-and-push' &&
      github.event.inputs.confirmation == 'CONFIRM' &&
      (github.event.inputs.environment == 'staging' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset database and push schema
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NODE_ENV: production

  reset-and-push-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'reset-and-push' &&
      github.event.inputs.confirmation == 'CONFIRM' &&
      (github.event.inputs.environment == 'production' || github.event.inputs.environment == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset database and push schema
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NODE_ENV: production
