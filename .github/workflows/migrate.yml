name: Database management

on:
  push:
    branches: [main, staging]
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RESET STAGING to allow a full staging database reset"
        required: false
        type: string

concurrency:
  group: database-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Auto-migration pipeline (on push to main) ───────────────────────
  migrate-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: migrate-staging
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    needs: verify-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify production schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  reset-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'RESET STAGING'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset staging database from tracked migrations
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
