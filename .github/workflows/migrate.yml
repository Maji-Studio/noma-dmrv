name: Database management

on:
  push:
    branches: [main, staging]
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - reset-seed-staging
          - reset-production
      authorized:
        description: "Check only after explicit approval to wipe production"
        required: false
        type: boolean
      confirmation:
        description: "Type RESET AND SEED STAGING or RESET PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: database-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Staging pipeline (push to staging only) ────────────────────────────
  migrate-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load staging database secret from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://Environment Variables/noma-dmrv env staging/DATABASE_URL

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log staging database target
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); console.log(`Database target: host=${url.hostname} port=${url.port || '5432'} user=${decodeURIComponent(url.username)} db=${url.pathname.slice(1)} sslmode=${url.searchParams.get('sslmode') ?? 'not set'}`)"

      - name: Run database migrations
        run: pnpm db:migrate

  verify-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: migrate-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load staging database secret from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://Environment Variables/noma-dmrv env staging/DATABASE_URL

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Log staging database target
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); console.log(`Database target: host=${url.hostname} port=${url.port || '5432'} user=${decodeURIComponent(url.username)} db=${url.pathname.slice(1)} sslmode=${url.searchParams.get('sslmode') ?? 'not set'}`)"

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema

  # ── Production pipeline (push to main only) ────────────────────────────
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load production database secret from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://Environment Variables/noma-dmrv env production/DATABASE_URL

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Log production database target
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); console.log(`Database target: host=${url.hostname} port=${url.port || '5432'} user=${decodeURIComponent(url.username)} db=${url.pathname.slice(1)} sslmode=${url.searchParams.get('sslmode') ?? 'not set'}`)"

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Verify production schema matches Drizzle definitions
        run: pnpm db:verify-schema

  # ── Manual reset + seed: staging ───────────────────────────────────────
  reset-seed-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/staging' &&
      github.event.inputs.action == 'reset-seed-staging' &&
      github.event.inputs.confirmation == 'RESET AND SEED STAGING'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load staging database + admin secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://Environment Variables/noma-dmrv env staging/DATABASE_URL
          ADMIN_EMAIL: op://Environment Variables/noma-dmrv env staging/ADMIN_EMAIL
          ADMIN_PASSWORD: op://Environment Variables/noma-dmrv env staging/ADMIN_PASSWORD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log staging database target
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); console.log(`Database target: host=${url.hostname} port=${url.port || '5432'} user=${decodeURIComponent(url.username)} db=${url.pathname.slice(1)} sslmode=${url.searchParams.get('sslmode') ?? 'not set'}`)"

      - name: Reset and seed staging database
        run: pnpm db:reset && pnpm db:seed && pnpm db:verify-schema

  # ── Manual reset: production ────────────────────────────────────────────
  reset-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.action == 'reset-production' &&
      github.event.inputs.authorized == 'true' &&
      github.event.inputs.confirmation == 'RESET PRODUCTION'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load production database + admin secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          DATABASE_URL: op://Environment Variables/noma-dmrv env production/DATABASE_URL
          ADMIN_EMAIL: op://Environment Variables/noma-dmrv env production/ADMIN_EMAIL
          ADMIN_PASSWORD: op://Environment Variables/noma-dmrv env production/ADMIN_PASSWORD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log production database target
        run: |
          node -e "const url = new URL(process.env.DATABASE_URL); console.log(`Database target: host=${url.hostname} port=${url.port || '5432'} user=${decodeURIComponent(url.username)} db=${url.pathname.slice(1)} sslmode=${url.searchParams.get('sslmode') ?? 'not set'}`)"

      - name: Reset production database from tracked migrations
        run: |
          pnpm db:reset
          pnpm db:verify-schema
