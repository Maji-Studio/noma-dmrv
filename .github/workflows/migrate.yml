name: Sync database schema

on:
  push:
    branches: [main]
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CONFIRM to reset and push the schema manually"
        required: true
        type: string

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.confirmation == 'CONFIRM'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset database and push schema
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NODE_ENV: production
