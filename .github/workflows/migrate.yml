name: Run database migrations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CONFIRM to run migrations manually'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.confirmation == 'CONFIRM')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
