name: Database management

on:
  push:
    branches: [main, staging]
    paths:
      - "src/db/schema/**"
      - "drizzle/**"
      - "drizzle.config.ts"
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - reset-seed-staging
          - reset-production
      confirmation:
        description: "Type RESET AND SEED STAGING or RESET PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: database-management-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Staging pipeline (push to staging only) ────────────────────────────
  migrate-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  verify-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs: migrate-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Production pipeline (push to main only) ────────────────────────────
  migrate-production:
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck application
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify production schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Manual reset + seed: staging ───────────────────────────────────────
  reset-seed-staging:
    runs-on: ubuntu-latest
    environment: staging
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'reset-seed-staging' &&
      github.event.inputs.confirmation == 'RESET AND SEED STAGING'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset and seed staging database
        run: pnpm db:reset && pnpm db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Verify staging schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Manual reset: production (pre-launch only) ─────────────────────────
  reset-production:
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.event.inputs.action == 'reset-production' &&
      github.event.inputs.confirmation == 'RESET PRODUCTION'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reset production database from tracked migrations
        run: pnpm db:reset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: Verify production schema matches Drizzle definitions
        run: pnpm db:verify-schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
