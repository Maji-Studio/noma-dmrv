name: E2E Live (Isometric sandbox)

# Runs ONLY the @live-tagged Playwright specs — the ones that talk to the real
# Isometric sandbox (project mapping, certification Settings round-trip, full
# New-Removal submit). They are excluded from the PR-blocking E2E workflow
# (e2e.yml runs --grep-invert "@live") so a registry outage or sandbox latency
# can never block a merge; this nightly run keeps the live coverage honest.
#
# Failures here mean "our integration drifted or the sandbox changed", not
# "this PR is broken" — triage them like the daily isometric-health.yml ping.

on:
  schedule:
    # 05:30 UTC daily — after the isometric-health.yml ping, before EU morning.
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  playwright-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: noma_dmrv_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/noma_dmrv_e2e
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      ALLOW_SELF_SIGNUP: "false"
      DISABLE_RATE_LIMIT: "true"
      # Same throwaway storage placeholders as e2e.yml — they only satisfy the
      # fail-closed env validation for the production build; no spec touches S3.
      STORAGE_PROVIDER: s3-compatible
      STORAGE_BUCKET: e2e-build
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: e2e-build
      STORAGE_SECRET_ACCESS_KEY: e2e-build-placeholder
      ISOMETRIC_ENVIRONMENT: sandbox
      # Live sandbox calls are slow (paginated template/project fetches at
      # 200–700ms each); a single worker avoids hammering the sandbox and the
      # higher timeout absorbs registry latency without flaking.
      PLAYWRIGHT_WORKERS: "1"
      PLAYWRIGHT_RETRIES: "1"

    steps:
      - name: Generate ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Load Isometric secrets from 1Password
        uses: 1password/load-secrets-action@581a835fb51b8e7ec56b71cf2ffddd7e68bb25e0 # v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ISOMETRIC_ACCESS_TOKEN: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_ACCESS_TOKEN
          ISOMETRIC_CLIENT_SECRET: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_CLIENT_SECRET
          ISOMETRIC_DEMO_PROJECT_ID: op://Environment Variables/noma-dmrv env staging/ISOMETRIC_DEMO_PROJECT_ID

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Write local env file for CLI scripts
        run: |
          cat <<EOF > .env.local
          DATABASE_URL=${DATABASE_URL}
          NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
          BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
          ALLOW_SELF_SIGNUP=${ALLOW_SELF_SIGNUP}
          DISABLE_RATE_LIMIT=${DISABLE_RATE_LIMIT}
          EOF

      - name: Apply schema
        run: pnpm drizzle-kit push --force

      - name: Run @live Playwright specs
        run: pnpm test:e2e --grep "@live"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-live-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
