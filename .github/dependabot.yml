# Security updates only — no routine version-bump PRs.
# open-pull-requests-limit: 0 disables version updates for the ecosystem
# while Dependabot security updates (enabled in repo settings) still open
# PRs for vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm-lock.yaml
    directories: ["/", "/site"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # v6 breaks the web worker under Turbopack (blank basemaps, #752/#870).
      # Its XSS fix only matters for untrusted attribution strings; ours are
      # constants. Revisit with maplibregl.setWorkerUrl() and the map smoke test.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
