# Security updates only — no routine version-bump PRs.
# open-pull-requests-limit: 0 disables version updates for the ecosystem
# while Dependabot security updates (enabled in repo settings) still open
# PRs for vulnerable dependencies.
version: 2
updates:
  - package-ecosystem: "npm" # covers pnpm-lock.yaml
    directories: ["/", "/site"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # v6 breaks the map worker under Turbopack (#752/#870).
      # See maps/maplibre-v6 in docs/open-questions-toolchain.md.
      - dependency-name: "maplibre-gl"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
