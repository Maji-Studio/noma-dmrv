# Supply-chain cooldown: resolver ignores versions younger than 3 days
minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

patchedDependencies:
