packages:
  - "."

# Supply-chain cooldown: resolver ignores versions younger than 3 days
minimumReleaseAge: 4320

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

patchedDependencies:
  '@better-auth/oauth-provider@1.7.10': patches/@better-auth__oauth-provider@1.7.10.patch

# minimatch 7 to 11.0.0 has a ReDoS advisory (GHSA-g3hv-75wg-m249) and
# typescript-eslint still asks for 9.x or 10.x. Drop once it accepts 11.
overrides:
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
