[operations.parameters]
"path.idOrCode" = "${API_FUZZ_BIOCHAR_PRODUCT_ID}"

[[operations]]
include-operation-id = "update_biochar_product"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_BIOCHAR_PRODUCT_ID}"
"header.If-Match" = "${API_FUZZ_BIOCHAR_PRODUCT_ETAG}"

[[operations]]
