# The stock read, movement history and write share the seeded biochar bin.
[[operations]]
include-operation-id = "get_bin_stock"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_BIOCHAR_BIN_ID}"

[[operations]]
include-operation-id = "find_output_stock_movements"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_BIOCHAR_BIN_ID}"

[[operations]]
include-operation-id = "record_output_stock_movement"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_BIOCHAR_BIN_ID}"

# The credit batch and the lab sample sit on a 200-year facility, so a sample
# needs no R0 or TGA evidence. The dry-run create, update and delete use them.
[[operations]]
include-operation-id = "get_credit_batch"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_CREDIT_BATCH_ID}"

[[operations]]
