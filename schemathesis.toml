[operations.parameters]
"path.idOrCode" = "${API_FUZZ_PRODUCTION_RUN_ID}"

[[operations]]
include-operation-id = "update_production_run"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_PRODUCTION_RUN_ID}"
"header.If-Match" = "${API_FUZZ_PRODUCTION_RUN_ETAG}"

[[operations]]
