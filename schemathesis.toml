[operations.parameters]
"path.idOrCode" = "${API_FUZZ_FEEDSTOCK_ID}"
"header.If-Match" = "${API_FUZZ_FEEDSTOCK_ETAG}"

[[operations]]
include-operation-id = "delete_feedstock"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_FEEDSTOCK_ID}"
"header.If-Match" = "${API_FUZZ_FEEDSTOCK_ETAG}"

[[operations]]
include-operation-id = "find_supplier_locations"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_SUPPLIER_ID}"

[[operations]]
include-operation-id = "get_reactor"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_REACTOR_ID}"

[[operations]]
include-operation-id = "get_production_run"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_PRODUCTION_RUN_ID}"

[[operations]]
include-operation-id = "update_production_run"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_PRODUCTION_RUN_ID}"
"header.If-Match" = "${API_FUZZ_PRODUCTION_RUN_ETAG}"

[[operations]]
include-operation-id = "delete_production_run"
[operations.parameters]
"path.idOrCode" = "${API_FUZZ_PRODUCTION_RUN_ID}"
"header.If-Match" = "${API_FUZZ_PRODUCTION_RUN_ETAG}"

[[operations]]
