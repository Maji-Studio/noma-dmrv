[operations.parameters]
"path.idOrCode" = "${API_FUZZ_DELIVERY_ID}"
"header.If-Match" = "${API_FUZZ_DELIVERY_ETAG}"

# Document content returns a redirect; the harness never follows storage capabilities.
[[operations]]
include-path-regex = "/documents/.*?/content$"
[operations.checks.positive_data_acceptance]
expected-statuses = [302, 401, 403, 404, 409, 414, 429, 431, "5xx"]
